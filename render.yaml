services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  - type: web
    name: run-for-a-cause-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: DATABASE_URL
        fromDatabase:
          name: run-for-a-cause-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://run-for-a-cause-frontend.onrender.com
      - key: BACKEND_URL
        value: https://run-for-a-cause-backend.onrender.com
      - key: CORS_ORIGINS
        value: '["https://run-for-a-cause-frontend.onrender.com"]'
      - key: STORAGE_BACKEND
        value: local
      - key: EMAIL_PROVIDER
        value: console
      - key: FROM_EMAIL
        value: noreply@runforacause.in
      - key: FROM_NAME
        value: RunForACause
      - key: PLATFORM_FEE_PERCENT
        value: "3.0"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_dummy
      - key: RAZORPAY_KEY_SECRET
        value: dummy_secret
      - key: RAZORPAY_WEBHOOK_SECRET
        value: dummy_webhook_secret
      - key: ENABLE_SCHEDULER
        value: "0"

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: run-for-a-cause-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        value: https://run-for-a-cause-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://run-for-a-cause-frontend.onrender.com
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        value: rzp_test_dummy

databases:
  - name: run-for-a-cause-db
    plan: free
    databaseName: runforacause
    user: runforacause
