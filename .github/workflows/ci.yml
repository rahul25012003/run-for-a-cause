name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rfac
          POSTGRES_PASSWORD: rfac
          POSTGRES_DB: rfac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rfac:rfac@localhost:5432/rfac_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-not-for-prod
        run: alembic upgrade head

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rfac:rfac@localhost:5432/rfac_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-not-for-prod
        run: pytest tests/ -p no:warnings -q

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run vitest
        working-directory: frontend
        run: npm test

      - name: Build (next build)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
