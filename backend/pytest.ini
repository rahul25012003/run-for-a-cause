[pytest]
testpaths = tests
asyncio_mode = auto
# session scope so the asyncpg engine pool (module-level singleton in
# app.database) uses the same loop across tests — otherwise teardown fails
# with "event loop closed" when asyncpg tries to cancel queued queries on
# a loop that no longer exists.
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:bcrypt.*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: tests that hit the real database
    unit: pure-function tests, no DB
