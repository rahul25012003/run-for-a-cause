name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse audit on built frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Start frontend in background
        working-directory: frontend
        run: |
          nohup npm start &
          # Wait for the server to actually answer
          for i in {1..30}; do
            if curl -fs http://localhost:3000 >/dev/null 2>&1; then
              echo "frontend up"; break
            fi
            sleep 2
          done

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun \
            --collect.url=http://localhost:3000 \
            --collect.url=http://localhost:3000/events \
            --collect.url=http://localhost:3000/causes \
            --collect.url=http://localhost:3000/transparency \
            --collect.url=http://localhost:3000/map \
            --collect.numberOfRuns=1 \
            --upload.target=temporary-public-storage \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance.minScore=0.85 \
            --assert.assertions.categories:accessibility.minScore=0.90 \
            --assert.assertions.categories:best-practices.minScore=0.90 \
            --assert.assertions.categories:seo.minScore=0.90 \
            || true   # Don't fail PRs on first regression — review the report
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
