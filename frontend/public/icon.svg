<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F08534"/>
      <stop offset="100%" stop-color="#C9520B"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Runner silhouette — profile view, running right, forward lean -->
  <!-- Head -->
  <circle cx="320" cy="96" r="44" fill="white"/>

  <!-- Torso (leaning ~15° forward) -->
  <line x1="310" y1="140" x2="256" y2="277"
        stroke="white" stroke-width="46" stroke-linecap="round"/>

  <!-- Right arm — swings forward and up -->
  <line x1="290" y1="172" x2="374" y2="128"
        stroke="white" stroke-width="38" stroke-linecap="round"/>

  <!-- Left arm — swings back -->
  <line x1="278" y1="182" x2="202" y2="236"
        stroke="white" stroke-width="38" stroke-linecap="round"/>

  <!-- Left leg — forward stride, knee lifted -->
  <polyline points="256,277 310,374 268,470"
            fill="none" stroke="white" stroke-width="44"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right leg — push-off, trailing back -->
  <polyline points="256,277 170,374 140,466"
            fill="none" stroke="white" stroke-width="44"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ground-speed accent bar -->
  <rect x="72" y="448" width="240" height="8" rx="4" fill="white" opacity="0.45"/>
</svg>
